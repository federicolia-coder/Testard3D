<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1e25"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="front"><rect x="0" y="270" width="512" height="260" transform="rotate(-18 256 270)"/></clipPath>
    <clipPath id="card"><rect width="1280" height="420" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#grid)"/>
    <!-- Logo: isometric cube with an orbit -->
    <g transform="translate(70 60) scale(0.58)">
      <ellipse cx="256" cy="270" rx="214" ry="74" transform="rotate(-18 256 270)" fill="none" stroke="#2f8fbf" stroke-width="24"/>
      <polygon points="256,120 385.9,195 256,270 126.1,195" fill="#ffb066"/>
      <polygon points="126.1,195 256,270 256,420 126.1,345" fill="#f26a24"/>
      <polygon points="256,270 385.9,195 385.9,345 256,420" fill="#a8401a"/>
      <ellipse cx="256" cy="270" rx="214" ry="74" transform="rotate(-18 256 270)" fill="none" stroke="#45c3ff" stroke-width="24" clip-path="url(#front)"/>
      <circle cx="256" cy="270" r="22" fill="#ffffff"/>
    </g>
    <text x="420" y="178" fill="#f2f4f7" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-3">Testard 3D</text>
    <text x="424" y="236" fill="#aab2bf" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="500">Modella, scolpisci, anima e renderizza.</text>
    <text x="424" y="276" fill="#aab2bf" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="500">Sul tuo computer, anche offline.</text>
    <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600">
      <rect x="424" y="312" width="176" height="44" rx="22" fill="#f26a24"/>
      <text x="512" y="341" fill="#ffffff" text-anchor="middle">0.6 · gratis</text>
      <rect x="614" y="312" width="300" height="44" rx="22" fill="none" stroke="#3a3f4a" stroke-width="2"/>
      <text x="764" y="341" fill="#d4d8df" text-anchor="middle">Windows · macOS · Linux</text>
    </g>
    <text x="1210" y="392" fill="#5d6573" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" text-anchor="end">TestardSoftware · reparto software di TestardStudios</text>
  </g>
</svg>
